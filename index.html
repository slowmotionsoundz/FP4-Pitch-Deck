
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Per4mance Pitch Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            overflow: hidden;
        }

        /* 3D Cube Transition Keyframes */
        @keyframes cubeOutLeft {
            0% { transform: translateX(0) rotateY(0deg); opacity: 1; filter: brightness(1); }
            100% { transform: translateX(-100%) rotateY(-90deg); opacity: 0; filter: brightness(0.5); }
        }

        @keyframes cubeInRight {
            0% { transform: translateX(100%) rotateY(90deg); opacity: 0; filter: brightness(0.5); }
            100% { transform: translateX(0) rotateY(0deg); opacity: 1; filter: brightness(1); }
        }

        @keyframes cubeOutRight {
            0% { transform: translateX(0) rotateY(0deg); opacity: 1; filter: brightness(1); }
            100% { transform: translateX(100%) rotateY(90deg); opacity: 0; filter: brightness(0.5); }
        }

        @keyframes cubeInLeft {
            0% { transform: translateX(-100%) rotateY(-90deg); opacity: 0; filter: brightness(0.5); }
            100% { transform: translateX(0) rotateY(0deg); opacity: 1; filter: brightness(1); }
        }

        /* Perspective Container */
        .perspective-container {
            perspective: 2500px;
            perspective-origin: 50% 50%;
            overflow: visible;
        }

        .animate-cube-out-left { animation: cubeOutLeft 0.8s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        .animate-cube-in-right { animation: cubeInRight 0.8s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        .animate-cube-out-right { animation: cubeOutRight 0.8s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        .animate-cube-in-left { animation: cubeInLeft 0.8s cubic-bezier(0.7, 0, 0.3, 1) forwards; }

        /* Text Animations */
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .animate-fade-slide-in {
            animation: fadeSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* Grain texture */
        .bg-grain {
            position: relative;
        }
        .bg-grain::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.05;
            pointer-events: none;
            z-index: 50;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #FF8C00;
            border-radius: 4px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-grain">
    <div id="root"></div>
</body>
</html>
